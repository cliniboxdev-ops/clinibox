<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinibox — Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   CLINIBOX — DYNAMIC GANTT ROADMAP
   Brand palette taken from the Clinibox logo:
   deep navy · blue · teal, on a soft off-white.
   Timeline axis is in MONTHS. Click a phase to open its tasks.
   Everything comes from the ROADMAP object in <script>.
   ========================================================== */
:root{
  --navy:#123a5e;        /* CLINI wordmark navy      */
  --navy2:#1c5a8f;       /* mid navy-blue            */
  --blue:#2a7dc0;        /* logo blue swoosh         */
  --sky:#3f9dd4;         /* lighter blue             */
  --teal:#2fb3a6;        /* BOX / wave teal          */
  --teal-d:#1f9488;
  --ink:#16324e;         /* body text                */
  --muted:#6b7f97;
  --bg:#eef3f8;
  --board:#ffffff;
  --line:#e3eaf2;
  --grid:#eef2f7;
  --mile:#123a5e;        /* milestone diamond        */
  --font:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
  --display:'Space Grotesk','Inter',sans-serif;
  --labelW:300px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);min-height:100vh;padding:20px clamp(14px,3vw,40px);
  background:
    radial-gradient(1100px 620px at 12% -10%,rgba(47,179,166,.12),transparent),
    radial-gradient(1000px 600px at 100% 115%,rgba(42,125,192,.12),transparent),
    var(--bg);}
.wrap{max-width:min(1560px,97vw);margin:0 auto}
:fullscreen{overflow:auto}
:fullscreen .wrap{max-width:100%}
:fullscreen .board{box-shadow:none}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:14px}
.logo-img{height:72px;width:auto;display:block;background:#fff;border-radius:14px;padding:6px 12px;border:1px solid var(--line);box-shadow:0 3px 12px rgba(18,58,94,.1)}
.logo-fb{display:none;align-items:center;gap:11px}
.logo-fb .emb{width:50px;height:50px;flex:none}
.logo-fb .word{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:.02em}
.logo-fb .word .b{color:var(--teal)}
.logo-fb .word .c{color:var(--navy)}
.title h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,3.3vw,2.5rem);letter-spacing:-.02em;color:var(--navy);line-height:1.1}
.title p{color:var(--muted);margin-top:8px;font-size:.92rem;max-width:56ch;line-height:1.5}
.tools{display:flex;gap:10px;align-items:center}
.btn{font-family:var(--font);font-size:.82rem;font-weight:600;color:var(--navy);background:var(--board);
  border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:7px;
  box-shadow:0 1px 2px rgba(18,58,94,.05)}
.btn:hover{border-color:var(--teal);color:var(--teal-d);transform:translateY(-1px);box-shadow:0 4px 12px rgba(47,179,166,.16)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:2px 0 16px;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.lg-dot{width:12px;height:12px;border-radius:4px}
.lg-dia{width:12px;height:12px;background:var(--mile);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--teal)}

/* board */
.board{background:var(--board);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:0 24px 60px -28px rgba(18,58,94,.35)}

/* axis */
.axis{display:grid;grid-template-columns:var(--labelW) 1fr;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(8px)}
.axis .corner{padding:12px 18px;font-family:var(--display);font-weight:600;font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:flex-end;border-right:1px solid var(--line)}
.axis .scale{position:relative}
.years{display:flex;height:30px}
.year{flex:1;border-right:2px dashed rgba(26,79,128,.45);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:.92rem;color:var(--navy2);background:rgba(42,125,192,.03)}
.year:nth-child(even){background:rgba(47,179,166,.045)}
.year:last-child{border-right:none}
.months{position:relative;height:26px}
.mtick{position:absolute;top:0;bottom:0;transform:translateX(-50%);font-size:.72rem;color:var(--muted);display:flex;align-items:center;white-space:nowrap}
.mtick::before{content:"";position:absolute;top:-4px;left:50%;width:1px;height:5px;background:var(--line)}

/* rows */
.rows{position:relative}
.gridlines{position:absolute;left:var(--labelW);right:0;top:0;bottom:0;pointer-events:none;z-index:0}
.gridlines .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.gridlines .yl{width:2px;background:repeating-linear-gradient(to bottom,rgba(26,79,128,.5) 0 7px,transparent 7px 14px)}
.row{display:grid;grid-template-columns:var(--labelW) 1fr;position:relative;z-index:1;border-bottom:1px solid var(--line);transition:background .2s}
.row.parent:hover{background:#f7fafd}
.rlabel{padding:0 12px 0 18px;display:flex;align-items:center;gap:11px;border-right:1px solid var(--line);min-height:70px}
.row.parent>.rlabel{cursor:pointer;user-select:none}
.chev{width:20px;height:20px;flex:none;display:grid;place-items:center;color:var(--muted);transition:transform .3s;border-radius:6px}
.row.parent.open .chev{transform:rotate(90deg)}
.row.parent .rlabel:hover .chev{background:rgba(18,58,94,.06);color:var(--navy)}
.swatch{width:10px;height:10px;border-radius:3px;flex:none}
.lname{font-weight:600;font-size:1.02rem;line-height:1.2;color:var(--ink)}
.lname{display:block}
.lsub{display:block;font-size:.72rem;color:var(--muted);margin-top:3px;line-height:1.3}
.bar.nolabel .btxt{display:none}
.bar-ext{position:absolute;top:50%;transform:translateY(-50%);font-size:.8rem;font-weight:600;color:var(--navy);white-space:nowrap;pointer-events:none;z-index:2}
.child-track .bar-ext{font-size:.76rem;font-weight:500;color:#3f556e}
.lmeta{margin-left:auto;font-family:var(--display);font-weight:600;font-size:.72rem;color:var(--navy2);
  background:rgba(42,125,192,.09);border-radius:100px;padding:3px 10px;flex:none}
.track{position:relative;min-height:70px}
.child-track{min-height:50px}

/* bars */
.bar{position:absolute;top:50%;transform:translateY(-50%) scaleX(0);transform-origin:left center;height:34px;border-radius:8px;
  display:flex;align-items:center;padding:0 12px;font-size:.82rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;
  cursor:default;transition:transform .7s cubic-bezier(.2,.8,.2,1),box-shadow .2s,filter .2s;box-shadow:0 3px 10px -3px rgba(18,58,94,.4)}
.bar.in{transform:translateY(-50%) scaleX(1)}
.bar::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.bar:hover{filter:brightness(1.06);box-shadow:0 8px 20px -4px rgba(18,58,94,.4),0 0 0 1px rgba(255,255,255,.25) inset}
.bar.parentbar{height:40px;font-weight:700;font-size:.9rem}
.bar.child{height:28px;font-size:.78rem;font-weight:500}
.bar .dur{margin-left:8px;opacity:.85;font-weight:500}
.bar .sheen{position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg)}
.bar.in .sheen{animation:sweep 1.1s ease .6s 1}
@keyframes sweep{to{left:130%}}

/* children container */
.children{overflow:hidden;max-height:0;transition:max-height .4s ease;background:#f4f8fc}
.row.parent.open + .children{max-height:400px}
.crow{display:grid;grid-template-columns:var(--labelW) 1fr;border-top:1px solid #eaf0f6}
.crow .rlabel{min-height:50px;padding-left:46px}
.crow .lname2{font-weight:500;font-size:.88rem;color:#3f556e}

/* milestones */
.mstone{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(45deg) scale(0);width:18px;height:18px;
  background:var(--mile);border-radius:3px;z-index:4;cursor:pointer;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--teal);
  transition:transform .3s,box-shadow .2s}
.mstone.in{transform:translate(-50%,-50%) rotate(45deg) scale(1)}
.mstone:hover{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--teal)}
.mlabel{position:absolute;top:calc(50% + 18px);transform:translateX(-50%);font-size:.72rem;color:var(--navy);
  font-weight:600;white-space:nowrap;text-align:center;pointer-events:none;max-width:140px;line-height:1.1;
  background:rgba(255,255,255,.82);padding:1px 5px;border-radius:5px}

/* tooltip */
.tip{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font-size:.78rem;color:var(--ink);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s;
  box-shadow:0 16px 40px -12px rgba(18,58,94,.35);max-width:260px}
.tip.show{opacity:1;transform:none}
.tip b{font-family:var(--display);font-size:.86rem}
.tip .r{color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center}
.tip .r em{color:var(--ink);font-style:normal;font-weight:600}

.foot{margin-top:16px;color:var(--muted);font-size:.78rem}
.foot b{color:var(--navy)}
/* ---- financials chart under the gantt (aligned to same month axis) ---- */
.chartboard{margin-top:16px;background:var(--board);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:0 24px 60px -28px rgba(18,58,94,.35);display:grid;grid-template-columns:var(--labelW) 1fr}
.chart-side{padding:20px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.chart-side h3{font-family:var(--display);font-size:1.05rem;color:var(--navy);font-weight:700}
.chart-side .csub{font-size:.76rem;color:var(--muted);line-height:1.45;margin-top:-4px}
.clegend{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.clegend .ci{display:flex;align-items:center;gap:10px;font-size:.83rem;color:var(--ink);font-weight:500}
.clegend .cl{width:26px;height:3px;border-radius:2px;flex:none}
.clegend .ci small{color:var(--muted);font-weight:400;font-size:.72rem}
.chart-main{position:relative}
.fin-line{opacity:0;animation:finfade .9s ease forwards}
@keyframes finfade{to{opacity:1}}
.fin-dot{opacity:0;animation:finfade .5s ease forwards}
@media(max-width:720px){:root{--labelW:180px}.title p{display:none}.chartboard{grid-template-columns:1fr}.chart-side{border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>

<div class="tip" id="tip"></div>

<script>
/* ==========================================================
   ROADMAP DATA — from the Clinibox roadmap.
   Positions are in MONTHS from start (month 0).
   Phase durations are the exact 9 / 3 / 12 / 24 months given.
   Sub-tasks & milestone months are laid out to match the
   roadmap Gantt — edit any number below.
   ========================================================== */
const ROADMAP = {
  totalMonths: 48,
  startLabel: "Year",
  phases: [
    {
      name:"Development", sub:"Infrastructure & MVP → prototype", color:"#2fb3a6",
      start:0, end:6,                                   // 6 months
      children:[
        { name:"Infrastructure setup", start:0, end:4 },
        { name:"MVP development", start:1, end:6 },
      ],
      milestones:[ { name:"Working prototype", month:6 } ],
    },
    {
      name:"POC", sub:"Proof of concept", color:"#2ba7c0",
      start:6, end:9,                                   // 3 months
      children:[
        { name:"BP integration", start:6, end:9 },
        { name:"Architecture to proof", start:6, end:9 },
      ],
      milestones:[ { name:"Proof of concept", month:9 } ],
    },
    {
      name:"Regulation", sub:"Submissions, approvals & consulting", color:"#2f9fc9",
      start:6, end:9,                                   // 3 months
      children:[
        { name:"Regulatory submissions & approvals", start:6, end:9 },
        { name:"Professional consulting", start:6, end:9 },
      ],
      milestones:[ { name:"Regulatory approval", month:9 } ],
    },
    {
      name:"First Production", sub:"Start production for first customers", color:"#2a86c4",
      start:9, end:12,                                  // 3 months
      children:[
        { name:"Production line setup", start:9, end:11 },
        { name:"First units produced", start:10, end:12 },
      ],
      milestones:[],
    },
    {
      name:"First Customers", sub:"First paying customers by end of Year 1", color:"#2a72ba",
      start:9, end:12,                                  // 3 months
      children:[
        { name:"Find first customers", start:9, end:12 },
        { name:"Close first deals", start:10, end:12 },
      ],
      milestones:[ { name:"First paying customer", month:12 } ],
    },
    {
      name:"Market Penetration", sub:"Small, mid-size & regional (Year 2)", color:"#2266a8",
      start:12, end:24,                                 // 12 months
      children:[
        { name:"Small & mid-size customers", start:12, end:24 },
        { name:"Regional customers", start:15, end:24 },
        { name:"Market-penetration push", start:12, end:24 },
      ],
      milestones:[ { name:"Regional & mid-size customers", month:18 } ],
    },
    {
      name:"Market Scale-Up", sub:"Expand commercial activity (from Year 3)", color:"#1a4f80",
      start:24, end:48,                                 // Year 3–4
      children:[
        { name:"Commercial expansion", start:24, end:48 },
        { name:"Scale infrastructure", start:24, end:42 },
      ],
      milestones:[ { name:"Profitable — Year 3", month:24 } ],
    },
    {
      name:"Strategic Partnerships", sub:"OEMs, insurers & ecosystem (from Year 3)", color:"#123a5e",
      start:24, end:48,                                 // Year 3–4, parallel
      children:[
        { name:"Aircraft manufacturers (OEM)", start:24, end:48 },
        { name:"Insurance companies", start:28, end:48 },
        { name:"Ecosystem partners", start:32, end:48 },
      ],
      milestones:[ { name:"First strategic partnership", month:32 } ],
    },
  ],
};
/* ==========================================================
   ⬆ edit numbers above ⬆   render below
   ========================================================== */

const T = ROADMAP.totalMonths;
const pct = m => (m / T) * 100;
const rowsEl = document.getElementById('rows');
const tip = document.getElementById('tip');
const years = Math.round(T/12);

/* axis */
const yearsEl = document.getElementById('years');
for(let y=0;y<years;y++){const d=document.createElement('div');d.className='year';d.textContent=ROADMAP.startLabel+' '+(y+1);yearsEl.appendChild(d);}
const monthsEl = document.getElementById('months');
for(let m=0;m<=T;m+=3){const d=document.createElement('div');d.className='mtick';d.style.left=pct(m)+'%';d.textContent='M'+m;monthsEl.appendChild(d);}
const gl = document.getElementById('gridlines');
for(let m=3;m<T;m+=3){const l=document.createElement('div');l.className='gl'+(m%12===0?' yl':'');l.style.left=pct(m)+'%';gl.appendChild(l);}

/* tooltip */
function showTip(html,e){tip.innerHTML=html;tip.classList.add('show');moveTip(e);}
function moveTip(e){const pad=14;let x=e.clientX+pad,y=e.clientY+pad;const r=tip.getBoundingClientRect();
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-pad;if(y+r.height>innerHeight-8)y=e.clientY-r.height-pad;
  tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.classList.remove('show');}
function barTip(name,s,eN,color){return `<b style="color:${color}">${name}</b>
  <div class="r">⏱ <em>${eN-s} months</em></div><div class="r">Month <em>${s}</em> → <em>${eN}</em></div>`;}
function mileTip(name,m){return `<b style="color:var(--navy)">◆ ${name}</b>
  <div class="r">Milestone at <em>Month ${m}</em></div><div class="r">≈ <em>Year ${Math.min(years,Math.ceil((m||1)/12))}</em></div>`;}

function makeMilestone(ms,track,delay){
  const d=document.createElement('div');d.className='mstone';d.style.left=pct(ms.month)+'%';
  const lab=document.createElement('div');lab.className='mlabel';lab.style.left=pct(ms.month)+'%';lab.textContent=ms.name;
  track.appendChild(d);track.appendChild(lab);
  d.addEventListener('mouseenter',e=>showTip(mileTip(ms.name,ms.month),e));
  d.addEventListener('mousemove',moveTip);d.addEventListener('mouseleave',hideTip);
  setTimeout(()=>d.classList.add('in'),delay);
}
const barRegistry=[];
function makeBar(cfg,track,cls,color,delay){
  const b=document.createElement('div');b.className='bar '+cls;b.style.left=pct(cfg.start)+'%';b.style.width=pct(cfg.end-cfg.start)+'%';
  b.style.background=`linear-gradient(120deg,${color},${shade(color,24)})`;
  b.innerHTML=`<span class="sheen"></span><span class="btxt">${cfg.name}</span>`;
  track.appendChild(b);
  const rec={b,cfg,track,ext:null};barRegistry.push(rec);
  b.addEventListener('mouseenter',e=>showTip(barTip(cfg.name,cfg.start,cfg.end,color),e));
  b.addEventListener('mousemove',moveTip);b.addEventListener('mouseleave',hideTip);
  setTimeout(()=>b.classList.add('in'),delay);
  fitBar(rec);
}
// Always show the FULL name. If it fits inside the bar, keep it inside (white);
// otherwise print it in full just to the right of the bar (dark). Re-runs on
// font load, resize and full-screen so text is never clipped at any width.
function fitBar(rec){
  const {b,cfg,track}=rec;const txtEl=b.querySelector('.btxt');
  if(rec.ext){rec.ext.remove();rec.ext=null;}
  b.classList.remove('nolabel');
  if(txtEl.scrollWidth+24 <= b.clientWidth) return;            // fits inside
  b.classList.add('nolabel');
  const ext=document.createElement('div');ext.className='bar-ext';ext.textContent=cfg.name;
  ext.style.left=`calc(${pct(cfg.end)}% + 9px)`;
  track.appendChild(ext);rec.ext=ext;
  if(ext.offsetLeft+ext.offsetWidth > track.clientWidth-4){    // would run off the right edge
    ext.remove();rec.ext=null;b.classList.remove('nolabel');   // keep it inside instead (these bars are wide)
  }
}
function refitBars(){barRegistry.forEach(fitBar);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refitBars);
let _rt;addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(refitBars,120);});
document.addEventListener('fullscreenchange',()=>setTimeout(refitBars,140));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=Math.min(255,(n>>16)+amt),g=Math.min(255,((n>>8)&255)+amt),bl=Math.min(255,(n&255)+amt);return`rgb(${r},${g},${bl})`;}

/* rows */
ROADMAP.phases.forEach((p,pi)=>{
  const baseDelay=200+pi*130;
  const row=document.createElement('div');row.className='row parent';
  const label=document.createElement('div');label.className='rlabel';
  label.innerHTML=`<span class="chev"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="swatch" style="background:${p.color}"></span>
    <span><span class="lname">${p.name}</span><span class="lsub">${p.sub||''}</span></span>
    <span class="lmeta">${p.end-p.start} mo</span>`;
  const track=document.createElement('div');track.className='track';
  row.appendChild(label);row.appendChild(track);rowsEl.appendChild(row);
  makeBar({name:p.name,start:p.start,end:p.end},track,'parentbar',p.color,baseDelay);
  p.milestones.forEach((ms,mi)=>makeMilestone(ms,track,baseDelay+300+mi*90));

  const kids=document.createElement('div');kids.className='children';
  p.children.forEach(c=>{const cr=document.createElement('div');cr.className='crow';
    const cl=document.createElement('div');cl.className='rlabel';cl.innerHTML=`<span class="lname2">${c.name}</span>`;
    const ct=document.createElement('div');ct.className='track child-track';
    cr.appendChild(cl);cr.appendChild(ct);kids.appendChild(cr);cr._cfg={c,color:p.color};});
  rowsEl.appendChild(kids);

  let open=false,built=false;
  function toggle(force){open=(force===undefined)?!open:force;row.classList.toggle('open',open);
    if(open&&!built){[...kids.children].forEach((cr,ci)=>{const{c,color}=cr._cfg;makeBar(c,cr.querySelector('.track'),'child',shade(color,16),120+ci*90);});built=true;}}
  label.addEventListener('click',()=>toggle());
  row._toggle=toggle;
  if(pi===0) setTimeout(()=>toggle(true),baseDelay+700);
});

document.getElementById('expandAll').onclick=()=>document.querySelectorAll('.row.parent').forEach(r=>r._toggle(true));
document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('.row.parent').forEach(r=>r._toggle(false));

/* full screen */
const fsBtn=document.getElementById('fullscreen');
fsBtn.onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};
document.addEventListener('fullscreenchange',()=>{fsBtn.textContent=document.fullscreenElement?'⛶ Exit full screen':'⛶ Full screen';});
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!/input|textarea/i.test(e.target.tagName))fsBtn.click();});

/* ==========================================================
   FINANCIALS CHART (aligned to the same 0–48 month axis)
   Values from the P&L / cash-flow plan, Years 1–4 (roadmap span).
   Money in $K. Points sit at year-ends: month 12/24/36/48.
   ========================================================== */
const FIN = {
  // one value per point at months [0, 12, 24, 36, 48]  (start, end-Y1..end-Y4)
  months:        [0,   12,    24,    36,    48],
  revenue:       [0,   0,     1915,  8376,  15576],   // $K, annual
  cumCashFlow:   [0,  -2160, -3530, -1430,  5117],    // $K, cumulative free cash flow
  cashBurn:      [0,  -2160, -1371,  2101,  6547],    // $K, yearly net cash flow (negative = burn)
  activeUnits:   [0,   0,     199,   656,   1221],    // count (right axis)
};
function renderFinChart(){
  const svg=document.getElementById('finChart');if(!svg)return;svg.innerHTML='';
  const W=1000,H=300,padT=18,padB=30,x0=0,x1=W;               // no left/right gutter → aligns with gantt months
  const yTop=padT,yBot=H-padB;
  const xF=m=>(m/ROADMAP.totalMonths)*W;
  // $ axis
  const moneyVals=[...FIN.revenue,...FIN.cumCashFlow,...FIN.cashBurn];
  let minK=Math.min(...moneyVals),maxK=Math.max(...moneyVals);
  minK=Math.floor(minK/2000)*2000; maxK=Math.ceil(maxK/2000)*2000;
  const yM=v=>yBot-((v-minK)/(maxK-minK))*(yBot-yTop);
  // units axis
  const maxU=Math.ceil(Math.max(...FIN.activeUnits)/200)*200;
  const yU=u=>yBot-(u/maxU)*(yBot-yTop);
  const NS='http://www.w3.org/2000/svg';
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const label=(x,y,s,{fill='var(--muted)',size=11,anchor='middle',weight=400,bg=false}={})=>{
    if(bg){const t=document.createElementNS(NS,'text');t.textContent=s;t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor',anchor);
      t.style.fill=fill;t.style.fontSize=size+'px';t.style.fontWeight=weight;t.style.paintOrder='stroke';t.style.stroke='#fff';t.style.strokeWidth='3px';t.style.strokeLinejoin='round';svg.appendChild(t);return;}
    const t=document.createElementNS(NS,'text');t.textContent=s;t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor',anchor);t.style.fill=fill;t.style.fontSize=size+'px';t.style.fontWeight=weight;if(weight>500)t.style.fontFamily='var(--display)';svg.appendChild(t);};
  // horizontal $ gridlines + left labels
  const steps=5;
  for(let i=0;i<=steps;i++){const v=minK+(maxK-minK)*i/steps;const y=yM(v);
    svg.appendChild(mk('line',{x1:x0,x2:x1,y1:y,y2:y,stroke:v===0?'rgba(18,58,94,.35)':'var(--grid)','stroke-width':v===0?1.4:1}));
    label(x0+6,y-3,(v/1000).toFixed(0)+'M',{anchor:'start',size:10.5,bg:true,fill:'#8892b5'});}
  // vertical dashed year lines (12,24,36) to match the gantt
  for(let m=12;m<ROADMAP.totalMonths;m+=12){const x=xF(m);
    svg.appendChild(mk('line',{x1:x,x2:x,y1:yTop,y2:yBot,stroke:'rgba(26,79,128,.4)','stroke-width':1.5,'stroke-dasharray':'5 6'}));}
  // month axis at bottom (aligned to gantt)
  for(let m=0;m<=ROADMAP.totalMonths;m+=6){label(xF(m),H-10,'M'+m,{size:10,fill:'#8892b5'});}
  // right-axis unit ticks
  for(let i=0;i<=4;i++){const u=maxU*i/4;label(x1-4,yU(u)-3,Math.round(u).toLocaleString(),{anchor:'end',size:10.5,fill:'#4aa8e0',weight:600,bg:true});}
  // series: [values, yScaleFn, color, dashed, width, name]
  const series=[
    {vals:FIN.revenue,     y:yM, color:'#2fb3a6', dash:'',    w:3,   name:'Revenue',              note:'annual, $M'},
    {vals:FIN.cumCashFlow, y:yM, color:'#123a5e', dash:'',    w:3.6, name:'Cumulative cash flow', note:'$M'},
    {vals:FIN.cashBurn,    y:yM, color:'#2a7dc0', dash:'7 5', w:2.6, name:'Cash burn',            note:'yearly net, $M'},
    {vals:FIN.activeUnits, y:yU, color:'#4aa8e0', dash:'',    w:2.6, name:'Active units',         note:'right axis'},
  ];
  series.forEach((s,si)=>{
    let d='';FIN.months.forEach((m,i)=>{d+=(i?'L':'M')+xF(m).toFixed(1)+' '+s.y(s.vals[i]).toFixed(1);});
    const p=mk('path',{d,fill:'none',stroke:s.color,'stroke-width':s.w,'stroke-linecap':'round','stroke-linejoin':'round',class:'fin-line'});
    if(s.dash)p.setAttribute('stroke-dasharray',s.dash);
    p.style.animationDelay=(0.2+si*0.18)+'s';svg.appendChild(p);
    FIN.months.forEach((m,i)=>{const c=mk('circle',{cx:xF(m),cy:s.y(s.vals[i]),r:3.6,fill:'#fff',stroke:s.color,'stroke-width':2,class:'fin-dot'});c.style.animationDelay=(0.5+si*0.18+i*0.05)+'s';svg.appendChild(c);});
  });
  // legend
  const L=document.getElementById('clegend');
  L.innerHTML=series.map(s=>`<div class="ci"><span class="cl" style="background:${s.color};${s.dash?'background:repeating-linear-gradient(90deg,'+s.color+' 0 6px,transparent 6px 10px)':''}"></span>${s.name} <small>${s.note}</small></div>`).join('');
}
renderFinChart();
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(renderFinChart,150);});
</script>
</body>
